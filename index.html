<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Musico - Stream Music & Podcasts</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f172a">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
.lyrics-wrap { background: #1e293b; border: 1px solid #334155; border-radius: 12px; flex-shrink: 0; }
.lyrics-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 12px; color: #94a3b8; border-bottom: 1px solid #334155; }
.lyrics-head button { background: #334155; color: #fff; border: none; border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; margin-left: 4px; }
.lyrics-box { position: relative; height: 170px; overflow-y: auto; padding: 12px; text-align: center; scroll-behavior: smooth; }
.lyric-line { padding: 6px 4px; font-size: 16px; color: #64748b; cursor: pointer; transition: color .2s, font-size .2s; line-height: 1.35; }
.lyric-line.active { color: #fff; font-weight: 700; font-size: 19px; }
.lyrics-msg { color: #94a3b8; font-size: 14px; padding-top: 40px; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 150px; }
button { font-family: inherit; }
button:focus-visible, .card:focus-visible, input:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
header { padding: 16px 20px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; border-bottom: 1px solid #334155; }
.logo { font-size: 22px; font-weight: 800; color: #3b82f6; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.logo-icon { width: 32px; height: 32px; background: #2563eb; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.top-actions { display: flex; gap: 8px; }
.top-btn { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
main { max-width: 900px; margin: auto; padding: 20px; }
.page { display: none; }
.page.active { display: block; }
h2 { margin: 20px 0 12px; font-size: 20px; color: #60a5fa; font-weight: 700; }
.empty { color: #94a3b8; font-size: 14px; }
.grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-bottom: 25px; }
.card { background: #1e293b; padding: 14px; border-radius: 14px; border: 1px solid #334155; cursor: pointer; transition: transform .2s; }
@media (hover: hover) { .card:hover { transform: translateY(-3px); border-color: #3b82f6; } }
.card-cover { height: 110px; border-radius: 10px; background: #334155; overflow: hidden; margin-bottom: 10px; }
.card-cover img { width: 100%; height: 100%; object-fit: cover; }
.card h3 { font-size: 13px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; min-height: 34px; }
.card p { color: #94a3b8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-row { display: flex; gap: 8px; margin-bottom: 14px; }
.search-input { flex: 1; min-width: 0; padding: 14px 20px; border-radius: 25px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; }
.search-btn { padding: 0 20px; border: none; border-radius: 25px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.chip { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }

.mini-player { display: none; position: fixed; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); left: 0; width: 100%; background: #1e293b; border-top: 1px solid #334155; padding: 10px 20px; z-index: 100; cursor: pointer; }
.mini-player.visible { display: block; }
.mini-player-inner { max-width: 900px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.track-meta { display: flex; align-items: center; gap: 12px; min-width: 0; }
.track-meta img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #334155; flex-shrink: 0; }
.track-meta div { min-width: 0; }
.track-meta h4, .track-meta p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; align-items: center; gap: 16px; }
.controls button { border: none; background: transparent; color: #fff; font-size: 20px; cursor: pointer; }
.controls .main-play { background: #2563eb; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; }

/* Full player stays rendered (slid off-screen) so the YouTube player keeps playing when closed */
.full-player { position: fixed; inset: 0; background: #0f172a; z-index: 300; display: flex; flex-direction: column; gap: 14px; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; opacity: 0.01; pointer-events: none; transition: opacity .2s; }
.full-player.active { opacity: 1; pointer-events: auto; }
.full-player-header { display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; font-size: 14px; }
.close-btn { font-size: 24px; background: none; border: none; color: #fff; cursor: pointer; }
.video-box { position: relative; width: min(100%, 260px); aspect-ratio: 1/1; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #334155; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.video-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; }
.video-box #ytPlayer, .video-box iframe { position: absolute; top: 0; left: 0; width: 200px; height: 200px; opacity: 1; pointer-events: none; z-index: 1; }
.track-header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.track-header-row h2 { color: #fff; font-size: 18px; margin: 0; }
.track-header-row p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
.add-btn { width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 2px solid #fff; background: none; color: #fff; font-size: 18px; display: grid; place-items: center; cursor: pointer; }
.progress-bar { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; background: #334155; border-radius: 2px; cursor: pointer; }
.progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.progress-bar::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: #fff; }
.time-stamps { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-top: 8px; }
.media-controls { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
.media-controls button { background: none; border: none; color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 28px; }
.media-controls .toggle { font-size: 20px; opacity: .5; }
.media-controls .toggle.on { opacity: 1; color: #22c55e; }
.media-controls .btn-play-large { width: 68px; height: 68px; background: #fff; color: #000; border-radius: 50%; font-size: 24px; }
.bottom-tools { display: flex; justify-content: space-around; }
.bottom-tools button { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: #334155; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 400; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 101; border-top: 1px solid #334155; }
.bottom-nav button { background: none; border: none; color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; gap: 3px; }
.bottom-nav button.active { color: #3b82f6; }
.profile-box { background: #1e293b; padding: 24px; border-radius: 16px; text-align: center; margin-top: 20px; border: 1px solid #334155; }
#userAvatar { font-size: 40px; width: 70px; height: 70px; margin: 0 auto 12px; display: grid; place-items: center; background: #334155; border-radius: 50%; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
html, body { touch-action: manipulation; }
.full-player, .full-player * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.lyrics-box { touch-action: pan-y; }
.lyric-line { cursor: default; }
.suggest { display: none; background: #1e293b; border: 1px solid #334155; border-radius: 14px; margin: -6px 0 14px; overflow: hidden; }
.suggest.show { display: block; }
.sug { display: flex; gap: 10px; align-items: center; padding: 12px 16px; font-size: 15px; color: #e2e8f0; cursor: pointer; border-bottom: 1px solid #334155; }
.sug:last-child { border-bottom: none; }
.lyrics-status { font-size: 11px; color: #64748b; padding: 6px 12px 0; text-align: center; min-height: 18px; }
.full-player input { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="showPage('home')"><div class="logo-icon">🎵</div><span>MUSICO</span></div>
  <div class="top-actions">
    <button class="top-btn" onclick="showPage('recent')">🕒 Recent</button>
    <button class="top-btn" onclick="showPage('profile')">👤 Profile</button>
  </div>
</header>

<main>
  <section id="homePage" class="page active">
    <h2>🔥 Trending Music</h2>
    <div class="chips" id="chips"></div>
    <div class="grid-container" id="trendGrid"><p class="empty">Loading...</p></div>
  </section>

  <section id="searchPage" class="page">
    <h2>Search your song bro</h2>
    <div class="search-row">
      <input type="search" id="songSearch" class="search-input" placeholder="Search songs, artists, podcasts..." aria-label="Search" autocomplete="off"
    oninput="onSearchInput(this.value)" onfocus="onSearchInput(this.value)" onkeydown="if(event.key==='Enter')runSearch()">
      <button class="search-btn" onclick="runSearch()">Search</button>
    </div>
<div class="suggest" id="suggestBox"></div>
    <div class="grid-container" id="searchResults"></div>
  </section>

  <section id="recentPage" class="page">
    <h2>🕒 Recently Played</h2>
    <div class="grid-container" id="recentGrid"></div>
  </section>

  <section id="libraryPage" class="page">
    <h2>📚 Your Library</h2>
    <div class="grid-container" id="libraryGrid"></div>
  </section>

  <section id="profilePage" class="page">
    <h2>Account Profile</h2>
    <div class="profile-box">
      <div id="userAvatar">👤</div>
      <h3 id="userName" style="font-size:18px;margin-bottom:4px">Account Login</h3>
      <p id="userEmail" class="empty" style="margin-bottom:20px">Sign in with Google to sync your profile</p>
      <div id="g_id_onload" data-client_id="721484485179-lf5o68dkv7fi098nub4rffs1appu0nta.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
      <div class="g_id_signin" id="googleSignInBtn" data-type="standard" style="display:flex;justify-content:center"></div>
      <button id="signOutBtn" onclick="signOut()" style="display:none;margin:15px auto;padding:10px 24px;background:#ef4444;color:#fff;border:none;border-radius:20px;cursor:pointer;font-weight:600">Sign Out</button>
    </div>
  </section>
</main>

<div class="mini-player" id="miniPlayer" onclick="openFullPlayer()">
  <div class="mini-player-inner">
    <div class="track-meta">
      <img id="miniCover" src="" alt="">
      <div><h4 id="miniTitle" style="font-size:14px"></h4><p id="miniArtist" style="font-size:12px;color:#94a3b8"></p></div>
    </div>
    <div class="controls" onclick="event.stopPropagation()">
      <button onclick="previousSong()" aria-label="Previous">⏮</button>
      <button class="main-play" onclick="togglePlay()" id="playButton" aria-label="Play or pause">▶</button>
      <button onclick="nextSong()" aria-label="Next">⏭</button>
    </div>
  </div>
</div>

<div class="full-player" id="fullPlayer">
  <div class="full-player-header">
    <button class="close-btn" onclick="closeFullPlayer()" aria-label="Close player">⌵</button>
    <span style="font-weight:600">Playing from YouTube</span>
    <button class="top-btn" onclick="triggerSleepTimer()" id="timerDisplayBtn">⏱️ Timer</button>
  </div>
  <div class="video-box"><img id="fullCover" src="" alt=""><div id="ytPlayer"></div></div>
  <div class="track-header-row">
    <div style="min-width:0"><h2 id="fullTitle">No song selected</h2><p id="fullArtist"></p></div>
    <button class="add-btn" onclick="saveTrack()" aria-label="Save to library">＋</button>
  </div>
  <div class="lyrics-wrap">
  <div class="lyrics-head">
    <span>Lyrics</span>
    <span>Sync:
      <button onclick="shiftLyrics(-0.5)">−0.5s</button>
      <button onclick="shiftLyrics(0.5)">+0.5s</button>
      <button onclick="addCustomLRC()">Add LRC</button>
      <button onclick="startAlign()">Align</button>
    </span>
  </div>
  <div class="lyrics-status" id="lyricsStatus"></div>
  <div class="lyrics-box" id="lyricsBox"><div id="lyricsBody"><p class="lyrics-msg">Play a song to see lyrics</p></div></div>
</div>
  <div>
    <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" step="0.1" aria-label="Seek"
      oninput="seeking = true; previewSeek(this.value)" onchange="seekAudio(this.value)">
    <div class="time-stamps"><span id="currentTime">0:00</span><span id="totalDuration">0:00</span></div>
  </div>
  <div class="media-controls">
    <button class="toggle" id="shuffleBtn" onclick="toggleShuffle()" aria-label="Shuffle">🔀</button>
    <button onclick="previousSong()" aria-label="Previous">⏮</button>
    <button class="btn-play-large" onclick="togglePlay()" id="fullPlayButton" aria-label="Play or pause">▶</button>
    <button onclick="nextSong()" aria-label="Next">⏭</button>
    <button class="toggle" id="repeatBtn" onclick="toggleRepeat()" aria-label="Repeat">🔁</button>
  </div>
  <div class="bottom-tools">
    <button onclick="saveTrack()">＋ Save to Library</button>
    <button onclick="shareTrack()">🔗 Share</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<nav class="bottom-nav">
  <button id="nav-home" class="active" onclick="showPage('home')">🏠<span>Home</span></button>
  <button id="nav-search" onclick="showPage('search')">🔍<span>Search</span></button>
  <button id="nav-library" onclick="showPage('library')">📚<span>Library</span></button>
</nav>

<script>
/* ===== 1. YOUR YOUTUBE DATA API KEY ===== */
const YT_API_KEY = "AIzaSyAxNB-ib2YieF3WbVIkIGkKnBp-uC1x-GU";
const REGION = "IN"; // region for trending music

const API = "https://www.googleapis.com/youtube/v3";
const FALLBACK = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#334155"/></svg>');

/* ---------- storage ---------- */
function load(key) {
  try { const d = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(d) ? d.filter(s => s && s.id) : []; }
  catch (e) { return []; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } }

let library = load('musico_yt_library'), recent = load('musico_yt_recent');
let trendList = [], searchList = [];
let currentPlaylist = [], currentIndex = -1, current = null;
let sleepTimerId = null, seeking = false, shuffleOn = false, repeatOn = false;
let player = null, playerReady = false, pendingId = null, tick = null;
let restoreCue = null, resumeAt = 0;

const lists = { trend: () => trendList, search: () => searchList, recent: () => recent, library: () => library };

/* ---------- helpers ---------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function decode(s) { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2600);
}
function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}
function hasKey() { return YT_API_KEY && !YT_API_KEY.startsWith('PASTE_'); }

function toSong(item) {
  const id = typeof item.id === 'string' ? item.id : item.id && item.id.videoId;
  const sn = item.snippet || {};
  const th = sn.thumbnails || {};
  return { id, title: decode(sn.title), artist: decode(sn.channelTitle), coverImg: (th.medium || th.high || th.default || {}).url || '' };
}

/* ---------- YouTube Data API ---------- */
async function ytFetch(path, params) {
  if (!hasKey()) throw new Error('Add your YouTube API key at the top of the script.');
  const url = `${API}/${path}?${new URLSearchParams({ ...params, key: YT_API_KEY })}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) throw new Error((data.error && data.error.message) || 'YouTube API error');
  return data;
}

async function loadTrending() {
  const el = document.getElementById('trendGrid');
  try {
    const data = await ytFetch('videos', { part: 'snippet', chart: 'mostPopular', videoCategoryId: '10', regionCode: REGION, maxResults: 20 });
    trendList = data.items.map(toSong).filter(s => s.id);
    renderGrid(el, trendList, 'trend');
    handleSharedLinkParam();
  } catch (e) {
    el.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
    handleSharedLinkParam();
  }
}

async function handleSharedLinkParam() {
  const urlParams = new URLSearchParams(window.location.search);
  const sharedVideoId = urlParams.get('v');
  if (!sharedVideoId) return;

  window.history.replaceState({}, document.title, window.location.pathname);

  let found = trendList.find(s => s.id === sharedVideoId);
  if (found) {
    playSong(found, trendList.indexOf(found), trendList);
    return;
  }

  try {
    const data = await ytFetch('videos', { part: 'snippet', id: sharedVideoId });
    if (data.items && data.items.length > 0) {
      const song = toSong(data.items[0]);
      if (song.id) {
        currentPlaylist = [song];
        playSong(song, 0, currentPlaylist);
      }
    }
  } catch (err) {
    console.error("Failed to load shared track:", err);
  }
}

async function runSearch() {
  const q = document.getElementById('songSearch').value.trim();
  const el = document.getElementById('searchResults');
  if (!q) return;
  hideSuggestions();
  addHistory(q);
  document.getElementById('songSearch').blur();
  el.innerHTML = '<p class="empty">Searching...</p>';
  try {
    const data = await ytFetch('search', { part: 'snippet', type: 'video', videoEmbeddable: 'true', maxResults: 20, q });
    searchList = data.items.map(toSong).filter(s => s.id);
    const topic = s => (/- topic$/i.test(s.artist) ? 1 : 0);
    searchList.sort((a, b) => topic(b) - topic(a));
    try { localStorage.setItem('musico_last_search', JSON.stringify({ q, list: searchList })); } catch (e) {}
    renderGrid(el, searchList, 'search', 'No results found.');
  } catch (e) {
    el.innerHTML = `<p class="empty">${esc(e.message)}</p>`;
  }
}

function quickSearch(q) {
  showPage('search');
  document.getElementById('songSearch').value = q;
  runSearch();
}

/* ---------- rendering ---------- */
function renderGrid(el, items, listName, emptyMsg) {
  if (!items.length) { el.innerHTML = `<p class="empty">${emptyMsg || 'Nothing here yet.'}</p>`; return; }
  el.innerHTML = items.map((s, i) => `
    <div class="card" tabindex="0" role="button" data-list="${listName}" data-idx="${i}">
      <div class="card-cover"><img src="${esc(s.coverImg || FALLBACK)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK}'"></div>
      <h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p>
    </div>`).join('');
}
function renderRecent() { renderGrid(document.getElementById('recentGrid'), recent, 'recent', 'No recently played songs yet. Start listening to build your history.'); }
function renderLibrary() { renderGrid(document.getElementById('libraryGrid'), library, 'library', 'No saved songs yet. Tap ＋ in the player to add songs here.'); }

document.addEventListener('click', e => {
  const card = e.target.closest('.card[data-list]');
  if (card) playFromList(card.dataset.list, Number(card.dataset.idx));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-list]')) {
    e.preventDefault(); playFromList(e.target.dataset.list, Number(e.target.dataset.idx));
  }
});

function playFromList(name, idx) {
  const list = lists[name]().slice();
  if (list[idx]) playSong(list[idx], idx, list);
}

/* ---------- YouTube IFrame player ---------- */
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function () {
  const vars = { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1 };
  if (location.protocol.startsWith('http')) vars.origin = location.origin;
  player = new YT.Player('ytPlayer', {
    width: '200', height: '200',
    playerVars: vars,
    events: {
      onReady: () => {
        playerReady = true;
        if (pendingId) {
          player.loadVideoById(pendingId); pendingId = null;
          setTimeout(() => {
            try {
              const st = player.getPlayerState();
              if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) toast('Tap the ▶ button to start');
            } catch (e) {}
          }, 3000);
        } else if (restoreCue) {
          player.cueVideoById({ videoId: restoreCue.id, startSeconds: restoreCue.start });
          restoreCue = null;
        }
      },
      onStateChange: onPlayerState,
      onError: onPlayerError
    }
  });
};

function onPlayerState(e) {
  const S = YT.PlayerState;
  setPlayIcons(e.data === S.PLAYING || e.data === S.BUFFERING);
  if (e.data === S.PLAYING) { resumeAt = 0; startTick(); }
  if (e.data === S.CUED || e.data === S.PAUSED) syncUIFromPlayer();
  if (e.data === S.ENDED) { stopTick(); if (repeatOn) { player.seekTo(0); player.playVideo(); } else nextSong(); }
}

function onPlayerError(e) {
  const code = e && e.data;
  const reasons = {
    2: 'invalid video',
    5: 'player error on this device',
    100: 'video removed or private',
    101: 'the owner blocked playing it in other apps',
    150: 'the owner blocked playing it in other apps',
    153: 'the page is not sending its address to YouTube. Open the hosted link in Chrome or Safari, not inside another app'
  };
  toast('Cannot play (error ' + code + '): ' + (reasons[code] || 'unknown reason'));
  if (code === 100 || code === 101 || code === 150) setTimeout(nextSong, 2500);
}

function togglePlay() {
  if (!current) { toast('Pick a song first'); return; }
  if (!playerReady) { toast('Player is still loading, tap again in a moment'); return; }
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) player.pauseVideo();
  else player.playVideo();
}

function startTick() {
  stopTick();
  tick = setInterval(() => {
    if (!playerReady) return;
    const d = player.getDuration(), t = player.getCurrentTime();
    updateLyrics(t);
    savePos(t);
    if (d && !seeking) {
      document.getElementById('seekBar').value = (t / d) * 100;
      document.getElementById('currentTime').textContent = formatTime(t);
      document.getElementById('totalDuration').textContent = formatTime(d);
    }
  }, 100);
}
function stopTick() { clearInterval(tick); }

function setPlayIcons(playing) {
  const icon = playing ? '⏸' : '▶';
  document.getElementById('playButton').textContent = icon;
  document.getElementById('fullPlayButton').textContent = icon;
}

function previewSeek(val) {
  if (playerReady) document.getElementById('currentTime').textContent = formatTime((val / 100) * player.getDuration());
}
function seekAudio(val) {
  if (playerReady && player.getDuration()) {
    const t = (val / 100) * player.getDuration();
    player.seekTo(t, true);
    updateLyrics(t);
  }
  seeking = false;
}
/* ---------- playback control ---------- */
function playSong(song, index, list) {
  if (list) currentPlaylist = list;
  currentIndex = index; current = song;
  restoreCue = null; resumeAt = 0; saveSession();
  const cover = song.coverImg || FALLBACK;
  document.getElementById('miniPlayer').classList.add('visible');
  document.getElementById('miniTitle').textContent = song.title;
  document.getElementById('miniArtist').textContent = song.artist;
  document.getElementById('miniCover').src = cover;
  document.getElementById('fullTitle').textContent = song.title;
  document.getElementById('fullArtist').textContent = song.artist;
  document.getElementById('fullCover').src = (song.coverImg || FALLBACK).replace('mqdefault', 'hqdefault');
  document.getElementById('seekBar').value = 0;
  document.getElementById('currentTime').textContent = '0:00';
  document.getElementById('totalDuration').textContent = '0:00';

  recent = [song, ...recent.filter(s => s.id !== song.id)].slice(0, 20);
  save('musico_yt_recent', recent);
  renderRecent();
  loadLyrics(song);

  if (playerReady) player.loadVideoById(song.id);
  else { pendingId = song.id; if (!window.YT) toast('Loading YouTube player...'); }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, artwork: cover ? [{ src: cover }] : [] });
  }
}

function nextSong() {
  const n = currentPlaylist.length;
  if (!n) return;
  let i = (currentIndex + 1) % n;
  if (shuffleOn && n > 1) { do { i = Math.floor(Math.random() * n); } while (i === currentIndex); }
  playSong(currentPlaylist[i], i);
}
function previousSong() {
  const n = currentPlaylist.length;
  if (!n) return;
  if (playerReady && player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
  const i = (currentIndex - 1 + n) % n;
  playSong(currentPlaylist[i], i);
}
function toggleShuffle() { shuffleOn = !shuffleOn; document.getElementById('shuffleBtn').classList.toggle('on', shuffleOn); toast(shuffleOn ? 'Shuffle on' : 'Shuffle off'); }
function toggleRepeat() { repeatOn = !repeatOn; document.getElementById('repeatBtn').classList.toggle('on', repeatOn); toast(repeatOn ? 'Repeat this song on' : 'Repeat off'); }

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', togglePlay);
  navigator.mediaSession.setActionHandler('pause', togglePlay);
  navigator.mediaSession.setActionHandler('previoustrack', previousSong);
  navigator.mediaSession.setActionHandler('nexttrack', nextSong);
}
function keepPlayingAfterClose() {
  let wasPlaying = false;
  try { wasPlaying = playerReady && player.getPlayerState() === YT.PlayerState.PLAYING; } catch (e) {}
  if (!wasPlaying) return;
  [300, 900, 1800].forEach(ms => setTimeout(() => {
    try {
      const st = player.getPlayerState();
      if (st === YT.PlayerState.PAUSED || st === YT.PlayerState.CUED) player.playVideo();
    } catch (e) {}
  }, ms));
}
function openFullPlayer() { document.getElementById('fullPlayer').classList.add('active'); }
function closeFullPlayer() {
  keepPlayingAfterClose();
  document.getElementById('fullPlayer').classList.remove('active');
}
/* ---------- library, share, timer ---------- */
function saveTrack() {
  if (!current) { toast('Play a song first'); return; }
  if (library.some(s => s.id === current.id)) { toast(`"${current.title}" is already in your Library`); return; }
  library.push(current);
  renderLibrary();
  toast(save('musico_yt_library', library) ? 'Saved to your Library' : 'Saved for this session only (storage unavailable)');
}

async function shareTrack() {
  if (!current) { toast('Play a song first'); return; }
  const url = `${window.location.origin}${window.location.pathname}?v=${current.id}`;
  try {
    if (navigator.share) { await navigator.share({ title: current.title, text: `Listening to ${current.title} on Musico`, url }); return; }
    await navigator.clipboard.writeText(url);
    toast('Link copied to clipboard');
  } catch (e) { if (e.name !== 'AbortError') toast('Sharing is not available here'); }
}

function triggerSleepTimer() {
  const mins = parseInt(prompt('Sleep timer in minutes (0 to cancel):', '30'), 10);
  if (isNaN(mins) || mins < 0) return;
  clearTimeout(sleepTimerId);
  const btn = document.getElementById('timerDisplayBtn');
  if (mins === 0) { btn.textContent = '⏱️ Timer'; toast('Sleep timer cancelled'); return; }
  btn.textContent = `⏱️ ${mins}m`;
  sleepTimerId = setTimeout(() => {
    if (playerReady) player.pauseVideo();
    btn.textContent = '⏱️ Timer';
    toast('Sleep timer finished. Music paused.');
  }, mins * 60000);
}

/* ---------- navigation ---------- */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id + 'Page').classList.add('active');
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');

}

/* ---------- Google sign-in (profile only) ---------- */
function handleCredentialResponse(r) {
  try {
    const b64 = r.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const p = JSON.parse(decodeURIComponent(escape(atob(b64))));

    document.getElementById('googleSignInBtn').style.display = 'none';
    document.getElementById('signOutBtn').style.display = 'block';
  } catch (err) { console.error('Auth error:', err); }
}
function signOut() {
  document.getElementById('userName').textContent = 'Account Login';
  document.getElementById('userEmail').textContent = 'Sign in with Google to sync your profile';
  document.getElementById('userAvatar').textContent = '👤';
  document.getElementById('googleSignInBtn').style.display = 'flex';
  document.getElementById('signOutBtn').style.display = 'none';

/* ---------- search suggestions ---------- */
let suggestTimer = null, suggestSeq = 0;

function getHistory() {
  try { const h = JSON.parse(localStorage.getItem('musico_search_history') || '[]'); return Array.isArray(h) ? h : []; }
  catch (e) { return []; }
}
function addHistory(q) {
  const h = [q, ...getHistory().filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  try { localStorage.setItem('musico_search_history', JSON.stringify(h)); } catch (e) {}
}
function fetchSuggestions(q) {
  return new Promise(resolve => {
    const cb = 'ytSuggest' + Date.now() + Math.floor(Math.random() * 1000);
    const s = document.createElement('script');
    const timer = setTimeout(() => done([]), 3000);
    function done(list) { clearTimeout(timer); delete window[cb]; s.remove(); resolve(list); }
    window[cb] = data => {
      try { done((data[1] || []).map(x => (Array.isArray(x) ? x[0] : x)).filter(Boolean)); }
      catch (e) { done([]); }
    };
    s.onerror = () => done([]);
    s.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&hl=en&q=' + encodeURIComponent(q) + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
function renderSuggestions(items, fromHistory) {
  const box = document.getElementById('suggestBox');
  if (!items.length) { box.classList.remove('show'); box.innerHTML = ''; return; }
  box.innerHTML = items.map(t =>
    `<div class="sug" data-q="${esc(t)}"><span>${fromHistory ? '🕘' : '🔍'}</span><span>${esc(t)}</span></div>`).join('');
  box.classList.add('show');
}
function hideSuggestions() { suggestSeq++; clearTimeout(suggestTimer); renderSuggestions([]); }
function onSearchInput(v) {
  clearTimeout(suggestTimer);
  const q = v.trim();
  if (!q) { suggestSeq++; renderSuggestions(getHistory(), true); return; }
  const seq = ++suggestSeq;
  suggestTimer = setTimeout(async () => {
    const local = getHistory().filter(h => h.toLowerCase().includes(q.toLowerCase()));
    renderSuggestions(local, true);
    const remote = await fetchSuggestions(q);
    if (seq !== suggestSeq) return;
    renderSuggestions([...new Set([...local, ...remote])].slice(0, 8));
  }, 250);
}
document.getElementById('suggestBox').addEventListener('click', e => {
  const el = e.target.closest('.sug');
  if (!el) return;
  document.getElementById('songSearch').value = el.dataset.q;
  runSearch();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-row') && !e.target.closest('#suggestBox')) hideSuggestions();
});

/* ---------- synced lyrics (LRCLIB) ---------- */
let lyrics = [], lyricIdx = -2, lyricsOffset = 0, userScrollUntil = 0;
let lyricsReq = 0;
let lyricsSongId = null;

const JUNK = /\b(official|lyrical|lyric|lyrics|video song|full video song|full video|full song|video|song|audio|4k|hd|hq|telugu|hindi|tamil|kannada|malayalam|new|latest|promo|jukebox)\b/gi;

/* ---------- Upgraded LRCLIB Lyrics Engine with Better Matching & Fallback ---------- */
async function loadLyrics(song) {
  const reqId = ++lyricsReq;
  const body = document.getElementById('lyricsBody');
  const status = document.getElementById('lyricsStatus');
  lyrics = []; lyricIdx = -2; lyricsOffset = 0;
  lyricsSongId = song.id;
  body.innerHTML = '<p class="lyrics-msg">Loading lyrics...</p>';
  status.textContent = '';

  const cleanArtist = song.artist.replace(/- Topic$/i, '').replace(/VEVO/gi, '').trim();
  const rawTitle = song.title;
  
  const cleanTitle = rawTitle
    .replace(/[\(\[\{].*?[\)\]\}]/g, '')
    .replace(JUNK, '')
    .replace(/\s+/g, ' ')
    .trim();

  const searchQueries = [
    { track_name: cleanTitle || rawTitle, artist_name: cleanArtist },
    { track_name: rawTitle, artist_name: cleanArtist },
    { track_name: cleanTitle || rawTitle, artist_name: '' },
    { q: `${cleanTitle} ${cleanArtist}`.trim() }
  ];

  let lrcText = null;

  for (const q of searchQueries) {
    if (reqId !== lyricsReq) return;
    try {
      const params = new URLSearchParams(q);
      const endpoint = q.q ? `https://lrclib.net/api/search?${params}` : `https://lrclib.net/api/get?${params}`;
      
      const res = await fetch(endpoint);
      if (!res.ok) continue;
      const data = await res.json();

      if (Array.isArray(data)) {
        const hit = data.find(x => x.syncedLyrics);
        if (hit) { lrcText = hit.syncedLyrics; break; }
      } else if (data && data.syncedLyrics) {
        lrcText = data.syncedLyrics;
        break;
      }
    } catch (e) {}
  }

  if (reqId !== lyricsReq) return;

  if (lrcText) {
    parseLRC(lrcText);
    if (lyrics.length) {
      renderLyricsDOM();
      status.textContent = 'Synced via LRCLIB (Tap "Align" or "+/- 0.5s" if off)';
      return;
    }
  }

  body.innerHTML = `
    <p class="lyrics-msg">No matching synced lyrics found.</p>
    <button onclick="manualLyricsSearch()" style="margin-top: 10px; background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 12px; cursor: pointer;">Search Manually</button>
  `;
  status.textContent = 'Manual search available';
}

/* ---------- Manual Search Fallback for Mismatched Songs ---------- */
async function manualLyricsSearch() {
  const customQuery = prompt('Enter exact Song Name and Artist for lyrics lookup:', `${current ? current.title : ''}`);
  if (!customQuery) return;

  const body = document.getElementById('lyricsBody');
  body.innerHTML = '<p class="lyrics-msg">Searching...</p>';

  try {
    const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(customQuery)}`);
    if (!res.ok) throw new Error('Search failed');
    const list = await res.json();
    const hit = list.find(x => x.syncedLyrics);

    if (hit && hit.syncedLyrics) {
      parseLRC(hit.syncedLyrics);
      renderLyricsDOM();
      document.getElementById('lyricsStatus').textContent = `Matched: ${hit.trackName} - ${hit.artistName}`;
      toast('Lyrics loaded successfully!');
    } else {
      body.innerHTML = '<p class="lyrics-msg">No synced lyrics found for this search.</p>';
    }
  } catch (err) {
    body.innerHTML = '<p class="lyrics-msg">Error searching for lyrics.</p>';
  }
}

function parseLRC(text) {
  lyrics = [];
  const lines = text.split('\n');
  const rx = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/g;
  for (const line of lines) {
    let match;
    rx.lastIndex = 0;
    const times = [];
    while ((match = rx.exec(line)) !== null) {
      const m = parseInt(match[1], 10), s = parseInt(match[2], 10);
      const ms = match[3] ? parseInt(match[3].length === 2 ? match[3] + '0' : match[3], 10) : 0;
      times.push(m * 60 + s + ms / 1000);
    }
    const textPart = line.replace(rx, '').trim();
    if (times.length && textPart) {
      for (const t of times) lyrics.push({ time: t, text: textPart });
    }
  }
  lyrics.sort((a, b) => a.time - b.time);
}

function renderLyricsDOM() {
  const body = document.getElementById('lyricsBody');
  if (!lyrics.length) {
    body.innerHTML = '<p class="lyrics-msg">Empty lyrics sheet</p>';
    return;
  }
  body.innerHTML = lyrics.map((l, i) => `<div class="lyric-line" id="lyric-${i}" onclick="jumpToLyric(${i})">${esc(l.text)}</div>`).join('');
}

function jumpToLyric(i) {
  if (!playerReady || !lyrics[i]) return;
  const targetTime = Math.max(0, lyrics[i].time + lyricsOffset);
  player.seekTo(targetTime, true);
  updateLyrics(targetTime);
}

function updateLyrics(currentTime) {
  if (!lyrics.length) return;
  const adjustedTime = currentTime - lyricsOffset;
  
  let activeI = -1;
  for (let i = 0; i < lyrics.length; i++) {
    if (lyrics[i].time <= adjustedTime) activeI = i;
    else break;
  }

  if (activeI !== lyricIdx) {
    lyricIdx = activeI;
    const box = document.getElementById('lyricsBox');
    if (Date.now() < userScrollUntil) return;

    document.querySelectorAll('.lyric-line').forEach((el, idx) => {
      if (idx === lyricIdx) {
        el.classList.add('active');
        box.scrollTo({ top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2, behavior: 'smooth' });
      } else {
        el.classList.remove('active');
      }
    });
  }
}

document.getElementById('lyricsBox').addEventListener('scroll', () => {
  userScrollUntil = Date.now() + 3500;
}, { passive: true });

function shiftLyrics(sec) {
  if (!lyrics.length) { toast('No active lyrics to shift'); return; }
  lyricsOffset += sec;
  toast(`Lyrics offset: ${lyricsOffset > 0 ? '+' : ''}${lyricsOffset.toFixed(1)}s`);
  if (playerReady) updateLyrics(player.getCurrentTime());
}

function addCustomLRC() {
  const text = prompt('Paste your LRC formatted lyrics text here:');
  if (!text) return;
  parseLRC(text);
  if (lyrics.length) {
    renderLyricsDOM();
    lyricsOffset = 0;
    toast('Custom LRC loaded successfully');
    document.getElementById('lyricsStatus').textContent = 'Custom LRC loaded';
  } else {
    toast('Invalid LRC format detected');
  }
}

function startAlign() {
  if (!lyrics.length) { toast('Load lyrics before aligning'); return; }
  if (!playerReady) return;
  const lineNum = parseInt(prompt(`Enter line number (1 to ${lyrics.length}) to sync with current playback time (${formatTime(player.getCurrentTime())}):`, '1'), 10);
  if (isNaN(lineNum) || lineNum < 1 || lineNum > lyrics.length) return;
  
  const targetIdx = lineNum - 1;
  const diff = player.getCurrentTime() - lyrics[targetIdx].time;
  lyricsOffset += diff;
  toast(`Aligned! Offset adjusted by ${diff > 0 ? '+' : ''}${diff.toFixed(2)}s`);
  updateLyrics(player.getCurrentTime());
}

/* ---------- Session & State Restoration ---------- */
function saveSession() {
  try {
    if (current) localStorage.setItem('musico_current', JSON.stringify({ current, currentPlaylist, currentIndex }));
  } catch (e) {}
}
function savePos(t) {
  try {
    if (current) localStorage.setItem('musico_pos', JSON.stringify({ id: current.id, t }));
  } catch (e) {}
}
function syncUIFromPlayer() {}

window.addEventListener('DOMContentLoaded', () => {
  renderRecent();
  renderLibrary();
  loadTrending();

  const tags = ['Arijit Singh', 'Top Pop Hits', 'Lo-fi Beats', 'Taylor Swift', 'Relaxing Piano', 'Hip Hop Hits', 'Podcasts'];
  document.getElementById('chips').innerHTML = tags.map(t => `<button class="chip" onclick="quickSearch('${esc(t)}')">${esc(t)}</button>`).join('');

  try {
    const savedPage = localStorage.getItem('musico_page');
    if (savedPage) showPage(savedPage);
  } catch (e) {}

  try {
    const s = localStorage.getItem('musico_current');
    const pos = localStorage.getItem('musico_pos');
    if (s) {
      const data = JSON.parse(s);
      if (data && data.current) {
        current = data.current;
        currentPlaylist = data.currentPlaylist || [current];
        currentIndex = typeof data.currentIndex === 'number' ? data.currentIndex : 0;
        
        document.getElementById('miniPlayer').classList.add('visible');
        document.getElementById('miniTitle').textContent = current.title;
        document.getElementById('miniArtist').textContent = current.artist;
        document.getElementById('miniCover').src = current.coverImg || FALLBACK;
        document.getElementById('fullTitle').textContent = current.title;
        document.getElementById('fullArtist').textContent = current.artist;
        document.getElementById('fullCover').src = (current.coverImg || FALLBACK).replace('mqdefault', 'hqdefault');
        loadLyrics(current);

        let t = 0;
        if (pos) {
          const pData = JSON.parse(pos);
          if (pData && pData.id === current.id) t = pData.t || 0;
        }
        restoreCue = { id: current.id, start: t };
      }
    }
  } catch (e) {}

  if (!hasKey()) {
    console.warn('Musico Warning: YouTube API Key is missing or default placeholder.');
  }
});
