<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musico</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    /* Paste your custom Musico CSS styles here */
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Google OAuth Sign-In Configuration -->
  <div id="g_id_onload"
       data-client_id="721484485179-lf5o68dkv7fi098nub4rffs1appu0nta.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-auto_select="false">
  </div>

  <!-- Google Sign-In Button Container -->
  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="sign_in_with"
       data-shape="rectangular"
       data-logo_alignment="left">
  </div>

  <!-- Your Musico App UI Elements (Player, Playlist, Search, etc.) -->
  <div id="player-container">
    <!-- Paste your YouTube iframe or audio player HTML here -->
  </div>

  <!-- Scripts -->
  <script>
    // Handle Google OAuth Login Callback
    function handleCredentialResponse(response) {
      console.log("Encoded JWT ID token: " + response.credential);
      // Add your login logic or session saving here
    }

    // Media Session API for Background Audio & Lock Screen Controls
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Playing Track",
        artist: "Musico App",
        album: "Musico Streaming",
        artwork: [
          { src: 'https://via.placeholder.com/512', sizes: '512x512', type: 'image/png' }
        ]
      });

      // Handle lock-screen media controls
      navigator.mediaSession.setActionHandler('play', () => {
        if (typeof player !== 'undefined' && player.playVideo) player.playVideo();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        if (typeof player !== 'undefined' && player.pauseVideo) player.pauseVideo();
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        if (typeof playPreviousTrack === 'function') playPreviousTrack();
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        if (typeof playNextTrack === 'function') playNextTrack();
      });
    }

    // Prevent auto-pausing when app is minimized or tab is switched
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (typeof player !== 'undefined' && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
          player.playVideo();
        }
      }
    });
  </script>
</body>
</html>
