<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musico - Music for Everyone</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #100d1c;
  color: white;
  font-family: Arial, sans-serif;
  padding-bottom: 140px;
}

header {
  padding: 18px 22px;
  background: #1b1530;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid #382b4b;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #bd8cff;
}

.top-actions {
  display: flex;
  gap: 12px;
}

.top-btn {
  background: #251d3a;
  color: #e6d4ff;
  border: 1px solid #493b60;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  transition: 0.2s;
}

.top-btn:hover {
  background: #9147d5;
  color: white;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h2 {
  margin: 20px 0 12px;
  font-size: 20px;
  color: #bd8cff;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: #211a32;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid #382b4b;
  cursor: pointer;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #9147d5;
}

.card-cover {
  height: 120px;
  border-radius: 10px;
  background: linear-gradient(135deg, #52238c, #d14c9e);
  display: grid;
  place-items: center;
  font-size: 40px;
  margin-bottom: 10px;
}

.card h3 {
  font-size: 15px;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card p {
  color: #b8accb;
  font-size: 12px;
}

.search-input {
  width: 100%;
  padding: 15px;
  border-radius: 25px;
  border: 1px solid #493b60;
  background: #211a32;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 20px;
}

.search-input:focus {
  border-color: #9147d5;
}

#hiddenAudioContainer {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0.01;
  pointer-events: none;
}

.player {
  position: fixed;
  bottom: 60px;
  left: 0;
  width: 100%;
  background: #211a32;
  border-top: 1px solid #55446e;
  padding: 10px 20px;
  z-index: 100;
}

.player-inner {
  max-width: 900px;
  margin: auto;
}

.now-playing-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  margin-bottom: 8px;
  color: #e6d4ff;
}

.timer-badge {
  font-size: 12px;
  color: #ff6c9c;
  background: #341e3d;
  padding: 3px 8px;
  border-radius: 10px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin: 6px 0;
}

.controls button {
  border: none;
  background: transparent;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.controls .main-play {
  background: #9147d5;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  place-items: center;
}

.modal-content {
  background: #211a32;
  padding: 20px;
  border-radius: 15px;
  border: 1px solid #55446e;
  text-align: center;
  max-width: 300px;
  width: 90%;
}

.modal-content button {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  background: #382b4b;
  border: 1px solid #55446e;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

.modal-content button:hover {
  background: #9147d5;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #1b1530;
  display: flex;
  justify-content: space-around;
  padding: 10px 5px;
  z-index: 100;
  border-top: 1px solid #493b60;
}

.bottom-nav button {
  background: none;
  border: none;
  color: #b8accb;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  cursor: pointer;
}

.bottom-nav button.active {
  color: #bd8cff;
}
</style>
</head>
<body>

<header>
  <div class="logo">🎵 MUSICO</div>
  <div class="top-actions">
    <button class="top-btn" onclick="showPage('home')">🏠 Home</button>
    <button class="top-btn" onclick="showPage('recents')">🕒 Recents</button>
    <button class="top-btn" onclick="showPage('profile')">👤 Profile</button>
  </div>
</header>

<main>
  <!-- Home Page -->
  <section id="homePage" class="page active">
    <h2>Playlists</h2>
    <div class="grid-container" id="playlistGrid"></div>

    <h2>Albums</h2>
    <div class="grid-container" id="albumGrid"></div>
  </section>

  <!-- Search Page -->
  <section id="searchPage" class="page">
    <h2>Search Songs</h2>
    <input
      type="text"
      id="songSearch"
      class="search-input"
      placeholder="Type any song, artist, or Telugu hits..."
      oninput="filterSearch()"
    >
    <div class="grid-container" id="searchResults"></div>
  </section>

  <!-- Library Page -->
  <section id="libraryPage" class="page">
    <h2>Your Library</h2>
    <div class="grid-container" id="libraryGrid"></div>
  </section>

  <!-- Recents Page -->
  <section id="recentsPage" class="page">
    <h2>Recently Played</h2>
    <div class="grid-container" id="recentsGrid"></div>
  </section>

  <!-- Profile Page -->
  <section id="profilePage" class="page">
    <h2>User Profile</h2>
    <div class="card">
      <h3>Musico Member</h3>
      <p style="margin-top: 8px;">Live YouTube API v3 Enabled</p>
    </div>
  </section>

  <!-- Background Audio Streamer Container -->
  <div id="hiddenAudioContainer">
    <div id="youtubePlayer"></div>
  </div>
</main>

<!-- Bottom Sticky Player -->
<div class="player">
  <div class="player-inner">
    <div class="now-playing-info">
      <span id="nowPlaying">Select a song to start listening</span>
      <span id="timerStatus" class="timer-badge" style="display:none;"></span>
    </div>

    <div class="controls">
      <button onclick="previousSong()">⏮</button>
      <button class="main-play" onclick="togglePlay()" id="playButton">▶</button>
      <button onclick="nextSong()">⏭</button>
      <button onclick="openTimerModal()" title="Sleep Timer">⏱️</button>
    </div>
  </div>
</div>

<!-- Bottom Navigation Bar -->
<nav class="bottom-nav">
  <button id="nav-home" class="active" onclick="showPage('home')">🏠<span>Home</span></button>
  <button id="nav-search" onclick="showPage('search')">🔍<span>Search</span></button>
  <button id="nav-library" onclick="showPage('library')">🎵<span>Library</span></button>
</nav>

<!-- Sleep Timer Modal -->
<div class="modal" id="timerModal">
  <div class="modal-content">
    <h3>Sleep Timer</h3>
    <button onclick="setSleepTimer(15)">15 Minutes</button>
    <button onclick="setSleepTimer(30)">30 Minutes</button>
    <button onclick="setSleepTimer(45)">45 Minutes</button>
    <button onclick="setSleepTimer(60)">60 Minutes</button>
    <button onclick="cancelSleepTimer()" style="background:#5c2424;">Turn Off</button>
    <button onclick="closeTimerModal()" style="background:transparent;">Close</button>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const YOUTUBE_API_KEY = "AIzaSyDqi_eQpFxhthmtrF_pOGygTjsuCihneBI";

const playlists = [
  { title: "Telugu Super Hits", count: "Live Search", cover: "🎧" },
  { title: "Bollywood Romance", count: "Live Search", cover: "💖" },
  { title: "Global Top Charts", count: "Live Search", cover: "🌍" }
];

const albums = [
  { title: "Trending Audio", artist: "YouTube Music", cover: "💿" },
  { title: "Top Hits", artist: "Global Artists", cover: "🌲" },
  { title: "Chill Vibes", artist: "Curated", cover: "🎸" }
];

let player;
let currentPlaylist = [];
let currentIndex = -1;
let isPlaying = false;
let sleepTimerId = null;
let sleepCountdownId = null;
let recents = [];
let searchTimeout = null;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('youtubePlayer', {
    height: '100',
    width: '100',
    playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1 },
    events: { 'onStateChange': onPlayerStateChange }
  });
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    isPlaying = true;
    document.getElementById('playButton').textContent = 'Ⅱ';
  } else if (event.data === YT.PlayerState.PAUSED) {
    isPlaying = false;
    document.getElementById('playButton').textContent = '▶';
  } else if (event.data === YT.PlayerState.ENDED) {
    nextSong();
  }
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));

  const targetPage = document.getElementById(pageId + 'Page');
  if (targetPage) targetPage.classList.add('active');

  const activeNav = document.getElementById('nav-' + pageId);
  if (activeNav) activeNav.classList.add('active');

  if (pageId === 'search') {
    document.getElementById('songSearch').focus();
  }
}

function renderDashboard() {
  document.getElementById('playlistGrid').innerHTML = playlists.map(p => `
    <div class="card" onclick="quickSearch('${p.title}')">
      <div class="card-cover">${p.cover}</div>
      <h3>${p.title}</h3>
      <p>${p.count}</p>
    </div>
  `).join('');

  document.getElementById('albumGrid').innerHTML = albums.map(a => `
    <div class="card" onclick="quickSearch('${a.title}')">
      <div class="card-cover">${a.cover}</div>
      <h3>${a.title}</h3>
      <p>${a.artist}</p>
    </div>
  `).join('');
}

function quickSearch(query) {
  showPage('search');
  document.getElementById('songSearch').value = query;
  filterSearch();
}

function filterSearch() {
  const query = document.getElementById('songSearch').value.trim();
  clearTimeout(searchTimeout);
  
  if (!query) {
    document.getElementById('searchResults').innerHTML = '<p style="color:#b8accb;">Type any song or artist name to search YouTube...</p>';
    return;
  }

  searchTimeout = setTimeout(async () => {
    try {
      document.getElementById('searchResults').innerHTML = '<p style="color:#bd8cff;">Searching YouTube...</p>';
      
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query + " audio song")}&type=video&maxResults=10&key=${YOUTUBE_API_KEY}`;
      
      const response = await fetch(url);
      const data = await response.json();

      if (data.error) {
        document.getElementById('searchResults').innerHTML = `<p style="color:#ff6c9c;">API Error: ${data.error.message}</p>`;
        return;
      }

      currentPlaylist = data.items.map(item => ({
        videoId: item.id.videoId,
        title: item.snippet.title,
        artist: item.snippet.channelTitle,
        cover: "🎵"
      }));

      renderDynamicSearchResults(currentPlaylist);
    } catch (error) {
      console.error("Search failed:", error);
      document.getElementById('searchResults').innerHTML = '<p style="color:#ff6c9c;">Failed to fetch songs. Check your connection or API key restrictions.</p>';
    }
  }, 500);
}

function renderDynamicSearchResults(list) {
  const container = document.getElementById('searchResults');
  if (!list.length) {
    container.innerHTML = '<p style="color:#b8accb;">No matching songs found.</p>';
    return;
  }
  
  container.innerHTML = list.map((song, index) => `
    <div class="card" onclick="playDynamicSong(${index})">
      <div class="card-cover">${song.cover}</div>
      <h3>${song.title}</h3>
      <p>${song.artist} • YouTube</p>
    </div>
  `).join('');
}

function playDynamicSong(index) {
  if (index < 0 || index >= currentPlaylist.length) return;
  
  currentIndex = index;
  const song = currentPlaylist[currentIndex];
  
  if (!recents.some(s => s.videoId === song.videoId)) {
    recents.unshift(song);
    updateRecentsUI();
  }

  if (player && typeof player.loadVideoById === 'function') {
    player.loadVideoById(song.videoId);
    player.playVideo();
    document.getElementById('nowPlaying').textContent = `🎵 Playing: ${song.title} - ${song.artist}`;
  }
}

function togglePlay() {
  if (currentIndex === -1 && currentPlaylist.length > 0) {
    playDynamicSong(0);
    return;
  }
  
  if (player && typeof player.getPlayerState === 'function') {
    const state = player.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  }
}

function nextSong() {
  if (!currentPlaylist.length) return;
  const nextIdx = (currentIndex + 1) % currentPlaylist.length;
  playDynamicSong(nextIdx);
}

function previousSong() {
  if (!currentPlaylist.length) return;
  const prevIdx = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
  playDynamicSong(prevIdx);
}

function updateRecentsUI() {
  document.getElementById('recentsGrid').innerHTML = recents.map((song, index) => `
    <div class="card" onclick="playRecentSong('${song.videoId}')">
      <div class="card-cover">${song.cover}</div>
      <h3>${song.title}</h3>
      <p>${song.artist}</p>
    </div>
  `).join('');
}

function playRecentSong(videoId) {
  const foundIndex = currentPlaylist.findIndex(s => s.videoId === videoId);
  if (foundIndex !== -1) {
    playDynamicSong(foundIndex);
  } else {
    const song = recents.find(s => s.videoId === videoId);
    if (song) {
      currentPlaylist.unshift(song);
      playDynamicSong(0);
    }
  }
}

function openTimerModal() {
  document.getElementById('timerModal').style.display = 'grid';
}

function closeTimerModal() {
  document.getElementById('timerModal').style.display = 'none';
}

function setSleepTimer(minutes) {
  cancelSleepTimer();
  let durationSeconds = minutes * 60;
  
  const statusBadge = document.getElementById('timerStatus');
  statusBadge.style.display = 'inline-block';

  sleepCountdownId = setInterval(() => {
    durationSeconds--;
    const mins = Math.floor(durationSeconds / 60);
    const secs = durationSeconds % 60;
    statusBadge.textContent = `⏱ Stop in ${mins}:${secs < 10 ? '0' : ''}${secs}`;

    if (durationSeconds <= 0) {
      clearInterval(sleepCountdownId);
    }
  }, 1000);

  sleepTimerId = setTimeout(() => {
    if (player && typeof player.pauseVideo === 'function') {
      player.pauseVideo();
    }
    alert("Sleep timer complete. Playback paused.");
    cancelSleepTimer();
  }, minutes * 60 * 1000);

  closeTimerModal();
}

function cancelSleepTimer() {
  if (sleepTimerId) clearTimeout(sleepTimerId);
  if (sleepCountdownId) clearInterval(sleepCountdownId);
  document.getElementById('timerStatus').style.display = 'none';
  closeTimerModal();
}

renderDashboard();
</script>

</body>
</html>
