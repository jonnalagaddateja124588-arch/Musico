<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musico - Web Music Player</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .logo {
      color: #1db954;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .player-card {
      background: #1e1e1e;
      border-radius: 16px;
      width: 100%;
      max-width: 650px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background-color: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Musico</div>
    <!-- Google OAuth Login Button -->
    <div id="g_id_onload"
         data-client_id="721484485179-lf5o68dkv7fi098nub4rffs1appu0nta.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_select="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="medium"
         data-theme="outline"
         data-text="sign_in"
         data-shape="pill">
    </div>
  </header>

  <main class="player-card">
    <!-- YouTube Player Embed -->
    <div class="video-container">
      <div id="youtube-player"></div>
    </div>
  </main>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    var player;

    // Load initial YouTube player state
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '360',
        width: '640',
        videoId: '',
        playerVars: {
          'playsinline': 1,
          'autoplay': 0
        }
      });
    }

    // Google Sign-In Callback Function
    function handleCredentialResponse(response) {
      console.log("Logged in token:", response.credential);
      alert("Successfully signed in to Musico!");
    }
  </script>
</body>
</html>
