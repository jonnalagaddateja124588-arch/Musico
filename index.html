<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musico - Web Music Player</title>
  
  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .logo {
      color: #1db954;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .player-card {
      background: #1e1e1e;
      border-radius: 16px;
      width: 100%;
      max-width: 650px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .track-info {
      text-align: center;
      margin-bottom: 20px;
    }
    .track-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .track-status {
      font-size: 0.9rem;
      color: #1db954;
    }
    .playlist {
      background: #282828;
      border-radius: 8px;
      overflow: hidden;
    }
    .playlist-item {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      cursor: pointer;
      transition: background 0.2s;
    }
    .playlist-item:last-child {
      border-bottom: none;
    }
    .playlist-item:hover {
      background: #383838;
    }
    .playlist-item .song-title {
      font-weight: 500;
    }
    .playlist-item .song-artist {
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Musico</div>
    <!-- Google OAuth Login Button -->
    <div id="g_id_onload"
         data-client_id="721484485179-lf5o68dkv7fi098nub4rffs1appu0nta.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_select="false">
    </div>
    <div class="g_id_signin"
         data-type="standard"
         data-size="medium"
         data-theme="outline"
         data-text="sign_in"
         data-shape="pill">
    </div>
  </header>

  <main class="player-card">
    <!-- YouTube Player Embed -->
    <div class="video-container">
      <div id="youtube-player"></div>
    </div>

    <div class="track-info">
      <div class="track-title" id="current-title">Loading Track...</div>
      <div class="track-status">● Background Audio Active</div>
    </div>

    <!-- Featured Playlist -->
    <div class="playlist">
      <div class="playlist-item" onclick="loadTrack('jfKfPfyJRdk', 'Lofi Hip Hop Beats', 'Lofi Girl')">
        <div>
          <div class="song-title">Lofi Hip Hop Beats</div>
          <div class="song-artist">Lofi Girl</div>
        </div>
        ▶ Play
      </div>
      <div class="playlist-item" onclick="loadTrack('5qap5aO4i9A', 'Lofi Chill Study Music', 'ChillHop')">
        <div>
          <div class="song-title">Lofi Chill Study Music</div>
          <div class="song-artist">ChillHop</div>
        </div>
        ▶ Play
      </div>
      <div class="playlist-item" onclick="loadTrack('DWcJFNfaw9c', 'Peaceful Piano Melody', 'Relaxing Music')">
        <div>
          <div class="song-title">Peaceful Piano Melody</div>
          <div class="song-artist">Relaxing Music</div>
        </div>
        ▶ Play
      </div>
    </div>
  </main>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    var player;
    var currentSongTitle = "Lofi Hip Hop Beats";
    var currentSongArtist = "Lofi Girl";

    // Load initial YouTube player state
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '360',
        width: '640',
        videoId: 'jfKfPfyJRdk',
        playerVars: {
          'playsinline': 1,
          'autoplay': 0
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      document.getElementById('current-title').innerText = currentSongTitle;
      updateMediaSession(currentSongTitle, currentSongArtist);
    }

    // Switch tracks when clicked in playlist
    function loadTrack(videoId, title, artist) {
      currentSongTitle = title;
      currentSongArtist = artist;
      document.getElementById('current-title').innerText = title;

      if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
      }
      updateMediaSession(title, artist);
    }

    // Google Sign-In Callback Function
    function handleCredentialResponse(response) {
      console.log("Logged in token:", response.credential);
      alert("Successfully signed in to Musico!");
    }

    // Set up Lock Screen controls & Media Session API
    function updateMediaSession(title, artist) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          album: "Musico Stream",
          artwork: [
            { src: 'https://via.placeholder.com/512', sizes: '512x512', type: 'image/png' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', () => {
          if (player && player.playVideo) player.playVideo();
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          if (player && player.pauseVideo) player.pauseVideo();
        });
      }
    }

    // Ensure playback stays active when screen locks or tab is hidden
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
          player.playVideo();
        }
      }
    });
  </script>
</body>
</html>
