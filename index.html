
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSICO - Music Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #10121c;
    color: white;
    font-family: Arial, sans-serif;
    padding-bottom: 110px;
}

header {
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 3px;
}

.logo span {
    color: #8b7cff;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 15px;
}

.cover {
    width: 100%;
    max-width: 330px;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 20px;
    display: block;
    margin: 20px auto;
    box-shadow: 0 10px 40px #0008;
}

.song-info {
    text-align: center;
    margin: 20px 0;
}

.song-info h2 {
    font-size: 25px;
    margin-bottom: 8px;
}

.song-info p {
    color: #aaa;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 32px;
    margin: 25px 0;
}

.controls button {
    background: none;
    border: none;
    color: white;
    font-size: 25px;
    cursor: pointer;
}

.controls .play {
    background: #8b7cff;
    color: white;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    font-size: 27px;
}

.progress-area {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #aaa;
    font-size: 12px;
}

input[type="range"] {
    flex: 1;
    accent-color: #8b7cff;
    cursor: pointer;
}

.actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0;
}

.actions button {
    background: #222536;
    color: white;
    border: 1px solid #34384d;
    padding: 12px 17px;
    border-radius: 12px;
    cursor: pointer;
}

.section {
    background: #191c2a;
    padding: 20px;
    border-radius: 16px;
    margin-top: 20px;
}

.section h3 {
    margin-bottom: 15px;
}

.lyrics {
    color: #c8c8d2;
    line-height: 2;
    white-space: pre-line;
    max-height: 220px;
    overflow-y: auto;
}

.lyrics-page {
    display: none;
    padding: 20px;
    text-align: center;
}

.lyrics-page .full-lyrics {
    white-space: pre-line;
    line-height: 2.3;
    margin-top: 25px;
    color: #ddd;
}

.menu {
    display: none;
    position: absolute;
    right: 20px;
    background: #282b3b;
    border-radius: 12px;
    width: 210px;
    overflow: hidden;
    z-index: 5;
    box-shadow: 0 8px 25px #0008;
}

.menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

.menu button:hover {
    background: #41445a;
}

.queue-item {
    padding: 12px;
    border-bottom: 1px solid #333;
    cursor: pointer;
    color: #ddd;
}

.queue-item:hover {
    color: #a99cff;
}

.bottom-player {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #191c2a;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #303347;
}

.bottom-player button {
    background: none;
    color: white;
    border: none;
    font-size: 22px;
    cursor: pointer;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.back {
    background: #292c3c;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 15px;
}

@media(max-width: 500px) {
    .controls {
        gap: 22px;
    }
    .cover {
        max-width: 280px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MUSI<span>CO</span></div>
    <button onclick="showPage('home')" style="background:none;color:white;border:none;font-size:20px;">⌂</button>
</header>

<div class="container">

    <main id="home" class="page active">

        <img id="cover" class="cover"
        src="https://placehold.co/500x500/29243d/ffffff?text=MUSICO"
        alt="Song artwork">

        <div class="song-info">
            <h2 id="songTitle">Select a Song</h2>
            <p id="artist">MUSICO Artist</p>
        </div>

        <div class="progress-area">
            <span id="currentTime">0:00</span>
            <input type="range" id="progress" value="0" min="0" max="100">
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button onclick="previousSong()">⏮</button>
            <button class="play" id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextSong()">⏭</button>
        </div>

        <div class="actions">
            <button onclick="showQueue()">☷ Queue</button>
            <button onclick="toggleMenu()">⋮ More</button>
        </div>

        <div class="menu" id="menu">
            <button onclick="saveLibrary()">♡ Save to Library</button>
            <button onclick="showMessage('JioTune requires Jio service support.')">♪ Set as JioTune</button>
            <button onclick="showMessage('Ringtone setting requires device support.')">♬ Set as ringtone</button>
            <button onclick="addPlaylist()">＋ Add to playlist</button>
            <button onclick="downloadSong()">↓ Download</button>
            <button onclick="shareSong()">↗ Share</button>
        </div>

        <div class="section">
            <h3>♪ Lyrics</h3>
            <div class="lyrics" id="lyricsPreview">
                Lyrics will appear here.
            </div>
            <button class="back" style="margin-top:15px;"
            onclick="showPage('lyricsPage')">View Full Lyrics →</button>
        </div>

        <div class="section" id="queueSection" style="display:none;">
            <h3>Up Next - Queue</h3>
            <div id="queueList"></div>
        </div>

        <div class="section">
            <h3>My Library</h3>
            <div id="libraryList">No saved songs yet.</div>
        </div>

        <div class="section">
            <h3>My Playlist</h3>
            <div id="playlistList">No playlists yet.</div>
        </div>

        <div class="section">
            <h3>Add Your Music</h3>
            <p style="color:#aaa;margin:12px 0;">
                Select audio files from your device.
            </p>
            <input type="file" id="fileInput" accept="audio/*" multiple>
        </div>

    </main>

    <main id="lyricsPage" class="page lyrics-page">
        <button class="back" onclick="showPage('home')">← Back</button>
        <h2 id="lyricsTitle">Song Lyrics</h2>
        <p id="lyricsArtist" style="color:#aaa;margin-top:10px;"></p>
        <div class="full-lyrics" id="fullLyrics">
            Lyrics will appear here.
        </div>
    </main>

</div>

<div class="bottom-player">
    <div>
        <strong id="miniTitle">MUSICO</strong>
        <p id="miniArtist" style="color:#aaa;font-size:12px;">Your music</p>
    </div>
    <button onclick="togglePlay()" id="miniPlay">▶</button>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const audio = document.getElementById("audio");

let songs = [];
let currentIndex = 0;
let library = [];
let playlist = [];

const demoLyrics = `Add your own lyrics here.
Each line will appear separately.
You can display the complete lyrics
on the full lyrics page.`;

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ":" + String(secs).padStart(2, "0");
}

function updateSongInfo() {
    const song = songs[currentIndex];
    if (!song) return;

    document.getElementById("songTitle").textContent = song.title;
    document.getElementById("artist").textContent = song.artist;
    document.getElementById("cover").src = song.cover;
    document.getElementById("miniTitle").textContent = song.title;
    document.getElementById("miniArtist").textContent = song.artist;

    document.getElementById("lyricsPreview").textContent = song.lyrics;
    document.getElementById("lyricsTitle").textContent = song.title + " - Lyrics";
    document.getElementById("lyricsArtist").textContent = song.artist;
    document.getElementById("fullLyrics").textContent = song.lyrics;

    renderQueue();
}

function playSong(index) {
    if (!songs.length) return;
    currentIndex = (index + songs.length) % songs.length;
    updateSongInfo();
    audio.src = songs[currentIndex].src;
    audio.play().then(() => updatePlayButtons()).catch(() => {
        showMessage("Unable to play this audio file.");
    });
}

function togglePlay() {
    if (!songs.length) {
        showMessage("First add songs from your device.");
        return;
    }

    if (audio.paused) {
        audio.play().then(updatePlayButtons).catch(() => {});
    } else {
        audio.pause();
        updatePlayButtons();
    }
}

function updatePlayButtons() {
    const symbol = audio.paused ? "▶" : "Ⅱ";
    document.getElementById("playBtn").textContent = symbol;
    document.getElementById("miniPlay").textContent = symbol;
}

function nextSong() {
    if (songs.length) playSong((currentIndex + 1) % songs.length);
}

function previousSong() {
    if (songs.length) playSong((currentIndex - 1 + songs.length) % songs.length);
}

audio.addEventListener("ended", nextSong);
audio.addEventListener("play", updatePlayButtons);
audio.addEventListener("pause", updatePlayButtons);

audio.addEventListener("timeupdate", () => {
    document.getElementById("currentTime").textContent = formatTime(audio.currentTime);
    document.getElementById("duration").textContent = formatTime(audio.duration);

    if (audio.duration) {
        document.getElementById("progress").value =
            (audio.currentTime / audio.duration) * 100;
    }
});

document.getElementById("progress").addEventListener("input", e => {
    if (audio.duration) {
        audio.currentTime = (e.target.value / 100) * audio.duration;
    }
});

document.getElementById("fileInput").addEventListener("change", e => {
    const files = Array.from(e.target.files);

    files.forEach(file => {
        const url = URL.createObjectURL(file);
        songs.push({
            title: file.name.replace(/\.[^/.]+$/, ""),
            artist: "Local Music",
            src: url,
            cover: "https://placehold.co/500x500/29243d/ffffff?text=MUSICO",
            lyrics: "Lyrics are not available for this song yet."
        });
    });

    renderQueue();

    if (songs.length && audio.paused && !audio.src) {
        playSong(0);
    }

    showMessage(files.length + " song(s) added!");
});

function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function saveLibrary() {
    if (!songs.length) return;
    const song = songs[currentIndex];

    if (!library.includes(song)) library.push(song);

    document.getElementById("libraryList").textContent =
        library.map(s => s.title).join(" • ");

    toggleMenu();
    showMessage("Saved to Library!");
}

function addPlaylist() {
    if (!songs.length) return;
    const name = prompt("Enter playlist name:");
    if (!name) return;

    playlist.push({name, song: songs[currentIndex]});
    document.getElementById("playlistList").textContent =
        playlist.map(p => p.name + ": " + p.song.title).join(" | ");

    toggleMenu();
}

function downloadSong() {
    if (!songs.length) return;
    const song = songs[currentIndex];
    const a = document.createElement("a");
    a.href = song.src;
    a.download = song.title + ".mp3";
    a.click();
    toggleMenu();
}

function shareSong() {
    if (!songs.length) return;
    const song = songs[currentIndex];

    if (navigator.share) {
        navigator.share({title: song.title, text: "Listen to " + song.title})
            .catch(() => {});
    } else {
        showMessage("Sharing is not supported on this browser.");
    }
    toggleMenu();
}

function showQueue() {
    const section = document.getElementById("queueSection");
    section.style.display =
        section.style.display === "none" ? "block" : "none";
    renderQueue();
}

function renderQueue() {
    const list = document.getElementById("queueList");
    list.innerHTML = "";

    songs.forEach((song, index) => {
        const item = document.createElement("div");
        item.className = "queue-item";
        item.textContent = (index === currentIndex ? "▶ " : "") + song.title;
        item.onclick = () => playSong(index);
        list.appendChild(item);
    });
}

function showPage(pageId) {
    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });
    document.getElementById(pageId).classList.add("active");
}

function showMessage(message) {
    alert(message);
}

// Media controls and lock-screen metadata where supported.
if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => audio.play());
    navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    navigator.mediaSession.setActionHandler("previoustrack", previousSong);
    navigator.mediaSession.setActionHandler("nexttrack", nextSong);
}

audio.addEventListener("loadedmetadata", () => {
    if ("mediaSession" in navigator && songs[currentIndex]) {
        const song = songs[currentIndex];
        navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist,
            artwork: [{src: song.cover, sizes: "512x512", type: "image/jpeg"}]
        });
    }
});
</script>

</body>
</html>
