
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSICO - Music Player</title>

<style>
*{box-sizing:border-box}
body{
 background:#0f172a;color:white;font-family:sans-serif;
 padding:20px;margin:0;padding-bottom:130px
}
h2{text-align:center;color:#1db954}
.search-box{
 display:flex;gap:10px;max-width:600px;
 margin:0 auto 20px
}
input{
 flex:1;padding:12px;border-radius:20px;
 border:1px solid #334155;background:#1e293b;color:white
}
button{
 padding:12px 18px;border-radius:20px;border:none;
 background:#1db954;color:white;font-weight:bold;cursor:pointer
}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:16px;max-width:900px;margin:auto
}
.card{
 background:#1e293b;padding:12px;border-radius:12px;
 border:1px solid #334155;text-align:center;cursor:pointer
}
.card img{
 width:100%;height:140px;object-fit:cover;border-radius:8px
}
.card h4{
 font-size:14px;margin:8px 0 4px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis
}
.card p{font-size:12px;color:#94a3b8;margin:0}

.player{
 position:fixed;bottom:0;left:0;right:0;
 background:#1e293b;padding:14px 20px;
 border-top:1px solid #334155;z-index:10
}
.player-top{
 display:flex;align-items:center;gap:15px;
 max-width:800px;margin:auto
}
.player-cover{
 width:65px;height:65px;object-fit:cover;border-radius:9px
}
.song-details{flex:1;min-width:0}
.song-details strong{display:block;overflow:hidden;text-overflow:ellipsis}
.song-details p{font-size:12px;color:#94a3b8;margin:5px 0}
.player-actions{display:flex;align-items:center;gap:12px}
.icon-btn{
 background:transparent;color:white;font-size:22px;
 padding:8px;border:none
}
.play-btn{
 background:#1db954;color:white;border-radius:50%;
 width:43px;height:43px;font-size:19px;padding:0
}
.progress-row{
 max-width:800px;margin:8px auto 0;
 display:flex;align-items:center;gap:10px;
 font-size:11px;color:#94a3b8
}
.progress-row input{padding:0;accent-color:#1db954}
.volume{max-width:800px;margin:5px auto}
.volume input{accent-color:#1db954}

.panel{
 background:#1e293b;padding:18px;border-radius:14px;
 max-width:800px;margin:20px auto;border:1px solid #334155
}
.panel h3{margin-top:0}
.lyrics-preview{
 white-space:pre-line;line-height:2;color:#cbd5e1;
 max-height:130px;overflow:auto
}
.text-btn{
 background:transparent;color:#1db954;padding:5px 0
}
.page{display:none;max-width:800px;margin:auto}
.page.active{display:block}
.back-btn{background:#334155;margin-bottom:20px}
.full-lyrics{
 text-align:center;white-space:pre-line;line-height:2.5;
 font-size:17px;color:#e2e8f0;padding:20px
}
.menu{
 display:none;position:fixed;bottom:115px;right:20px;
 width:220px;background:#263449;border:1px solid #475569;
 border-radius:13px;overflow:hidden;z-index:20;
 box-shadow:0 8px 25px #0008
}
.menu button{
 display:block;width:100%;text-align:left;
 background:transparent;color:white;border-radius:0;
 padding:14px;border-bottom:1px solid #334155
}
.menu button:hover{background:#334155}
.queue-item{
 display:flex;align-items:center;gap:12px;padding:10px;
 border-bottom:1px solid #334155;cursor:pointer
}
.queue-item img{width:45px;height:45px;object-fit:cover;border-radius:7px}
.queue-item p{font-size:12px;color:#94a3b8;margin:4px 0}
.queue-item.active{color:#1db954}
@media(max-width:550px){
 body{padding:12px;padding-bottom:140px}
 .player{padding:10px}
 .player-actions{gap:3px}
 .player-cover{width:48px;height:48px}
 .icon-btn{font-size:18px;padding:6px}
 .play-btn{width:38px;height:38px}
}
</style>
</head>

<body>

<h2>🎵 MUSICO</h2>

<div class="search-box">
 <input id="query" placeholder="Search songs...">
 <button onclick="searchSpotify()">Search</button>
</div>

<div id="homePage" class="page active">
 <div class="grid" id="results"></div>

 <div class="panel">
  <h3>☷ Queue</h3>
  <div id="queueList">Your queue is empty.</div>
 </div>

 <div class="panel">
  <h3>♡ My Library</h3>
  <div id="libraryList">No saved songs yet.</div>
 </div>

 <div class="panel">
  <h3>🎵 My Playlist</h3>
  <div id="playlistList">No playlists yet.</div>
 </div>

 <div class="panel">
  <h3>♪ Lyrics</h3>
  <div id="lyricsPreview" class="lyrics-preview">
   Select a song to view its lyrics.
  </div>
  <button class="text-btn" onclick="openLyrics()">View Full Lyrics →</button>
 </div>
</div>

<div id="lyricsPage" class="page">
 <button class="back-btn" onclick="showPage('homePage')">← Back</button>
 <h2 id="lyricsSongTitle">Song Lyrics</h2>
 <p id="lyricsArtist" style="text-align:center;color:#94a3b8"></p>
 <div id="fullLyrics" class="full-lyrics">
  Lyrics are not available yet.
 </div>
</div>

<div class="menu" id="moreMenu">
 <button onclick="saveLibrary()">♡ Save to Library</button>
 <button onclick="jioTune()">♪ Set as JioTune</button>
 <button onclick="ringtone()">♬ Set as ringtone</button>
 <button onclick="addPlaylist()">＋ Add to playlist</button>
 <button onclick="downloadSong()">↓ Download</button>
 <button onclick="shareSong()">↗ Share</button>
</div>

<div class="player" id="player" style="display:none">
 <div class="player-top">
  <img id="playerCover" class="player-cover"
  src="https://placehold.co/100x100/1e293b/ffffff?text=M">
  <div class="song-details">
   <strong id="trackTitle">Song title</strong>
   <p id="trackArtist">Artist</p>
  </div>
  <div class="player-actions">
   <button class="icon-btn" onclick="previousSong()">⏮</button>
   <button class="play-btn" id="playButton" onclick="togglePlay()">▶</button>
   <button class="icon-btn" onclick="nextSong()">⏭</button>
   <button class="icon-btn" onclick="showQueue()">☷</button>
   <button class="icon-btn" onclick="toggleMenu()">⋮</button>
  </div>
 </div>

 <div class="progress-row">
  <span id="currentTime">0:00</span>
  <input type="range" id="progress" min="0" max="100" value="0">
  <span id="duration">0:00</span>
 </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// Spotify search configuration
const CLIENT_ID = 'YOUR_CLIENT_ID';
const CLIENT_SECRET = 'YOUR_CLIENT_SECRET';

let accessToken = '';
let songs = [];
let currentIndex = -1;
let library = [];
let playlists = [];

const audio = document.getElementById('audio');

function escapeHTML(value){
 return String(value ?? '').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

async function getAccessToken(){
 const response = await fetch('https://accounts.spotify.com/api/token',{
  method:'POST',
  headers:{
   'Content-Type':'application/x-www-form-urlencoded',
   'Authorization':'Basic '+btoa(CLIENT_ID+':'+CLIENT_SECRET)
  },
  body:'grant_type=client_credentials'
 });
 const data=await response.json();
 if(!response.ok) throw new Error(data.error_description || 'Spotify authentication failed');
 accessToken=data.access_token;
}

async function searchSpotify(){
 const q=document.getElementById('query').value.trim();
 if(!q)return;

 try{
  if(!accessToken)await getAccessToken();

  const response=await fetch(
   `https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=track&limit=12`,
   {headers:{'Authorization':'Bearer '+accessToken}}
  );

  if(!response.ok)throw new Error('Spotify search failed. Check your API access.');

  const data=await response.json();
  renderTracks(data.tracks.items);
 }catch(error){
  alert(error.message);
 }
}

function renderTracks(tracks){
 const container=document.getElementById('results');
 container.innerHTML='';

 tracks.forEach(track=>{
  const cover=track.album.images[0]?.url || 'https://placehold.co/300';
  const artist=track.artists.map(a=>a.name).join(', ');

  const card=document.createElement('div');
  card.className='card';

  const img=document.createElement('img');
  img.src=cover;
  img.alt='Album artwork';

  const title=document.createElement('h4');
  title.textContent=track.name;

  const artistText=document.createElement('p');
  artistText.textContent=artist;

  card.append(img,title,artistText);
  card.onclick=()=>playTrack({
   id:track.id,
   title:track.name,
   artist,
   cover,
   preview:track.preview_url,
   lyrics:'Lyrics are not available for this song yet.',
   spotifyUrl:track.external_urls.spotify
  });

  container.appendChild(card);
 });
}

function playTrack(song){
 if(!song.preview){
  alert('No playable 30-second preview is available for this song.');
  return;
 }

 const existing=songs.findIndex(s=>s.id===song.id);
 if(existing>=0){
  currentIndex=existing;
 }else{
  songs.push(song);
  currentIndex=songs.length-1;
 }

 audio.src=song.preview;
 document.getElementById('player').style.display='block';

 updatePlayer();
 audio.play().catch(()=>alert('Press Play to start the song.'));
}

function updatePlayer(){
 const song=songs[currentIndex];
 if(!song)return;

 document.getElementById('trackTitle').textContent=song.title;
 document.getElementById('trackArtist').textContent=song.artist;
 document.getElementById('playerCover').src=song.cover;

 document.getElementById('lyricsPreview').textContent=song.lyrics;
 document.getElementById('lyricsSongTitle').textContent=song.title+' - Lyrics';
 document.getElementById('lyricsArtist').textContent=song.artist;
 document.getElementById('fullLyrics').textContent=song.lyrics;

 renderQueue();

 if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({
   title:song.title,
   artist:song.artist,
   artwork:[{src:song.cover,sizes:'512x512',type:'image/jpeg'}]
  });
 }
}

function togglePlay(){
 if(!audio.src)return;
 if(audio.paused)audio.play();
 else audio.pause();
}

audio.addEventListener('play',()=>document.getElementById('playButton').textContent='Ⅱ');
audio.addEventListener('pause',()=>document.getElementById('playButton').textContent='▶');

function nextSong(){
 if(!songs.length)return;
 const next=(currentIndex+1)%songs.length;
 currentIndex=next;
 audio.src=songs[currentIndex].preview;
 updatePlayer();
 audio.play().catch(()=>{});
}

function previousSong(){
 if(!songs.length)return;
 currentIndex=(currentIndex-1+songs.length)%songs.length;
 audio.src=songs[currentIndex].preview;
 updatePlayer();
 audio.play().catch(()=>{});
}

audio.addEventListener('ended',nextSong);

function formatTime(time){
 if(!Number.isFinite(time))return '0:00';
 return Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0');
}

audio.addEventListener('timeupdate',()=>{
 document.getElementById('currentTime').textContent=formatTime(audio.currentTime);
 document.getElementById('duration').textContent=formatTime(audio.duration);
 if(audio.duration){
  document.getElementById('progress').value=audio.currentTime/audio.duration*100;
 }
});

document.getElementById('progress').addEventListener('input',e=>{
 if(audio.duration)audio.currentTime=e.target.value/100*audio.duration;
});

function toggleMenu(){
 const menu=document.getElementById('moreMenu');
 menu.style.display=menu.style.display==='block'?'none':'block';
}

function closeMenu(){
 document.getElementById('moreMenu').style.display='none';
}

function getCurrentSong(){
 if(currentIndex<0)return null;
 return songs[currentIndex];
}

function saveLibrary(){
 const song=getCurrentSong();
 if(!song)return;
 if(!library.some(s=>s.id===song.id))library.push(song);
 document.getElementById('libraryList').textContent=library.map(s=>s.title).join(' • ');
 closeMenu();
 alert('Saved to Library!');
}

function jioTune(){
 closeMenu();
 alert('JioTune requires Jio service support. This website cannot set it directly.');
}

function ringtone(){
 closeMenu();
 alert('Setting a ringtone requires device-specific permission or a native app.');
}

function addPlaylist(){
 const song=getCurrentSong();
 if(!song)return;

 const name=prompt('Enter playlist name:');
 if(!name)return;

 let p=playlists.find(x=>x.name===name);
 if(!p){
  p={name,songs:[]};
  playlists.push(p);
 }
 if(!p.songs.some(s=>s.id===song.id))p.songs.push(song);

 document.getElementById('playlistList').innerHTML=playlists.map(p=>
  '<p>'+escapeHTML(p.name)+': '+p.songs.map(s=>escapeHTML(s.title)).join(', ')+'</p>'
 ).join('');

 closeMenu();
}

function downloadSong(){
 const song=getCurrentSong();
 closeMenu();
 if(!song)return;

 alert('Spotify previews are not available as downloadable full songs. Download is only available for audio files you own or have permission to distribute.');
}

async function shareSong(){
 const song=getCurrentSong();
 closeMenu();
 if(!song)return;

 try{
  if(navigator.share){
   await navigator.share({title:song.title,text:'Listen to '+song.title,url:song.spotifyUrl});
  }else{
   await navigator.clipboard.writeText(song.spotifyUrl);
   alert('Song link copied!');
  }
 }catch(e){}
}

function showQueue(){
 document.getElementById('queueList').scrollIntoView({behavior:'smooth'});
}

function renderQueue(){
 const list=document.getElementById('queueList');
 list.innerHTML='';

 if(!songs.length){
  list.textContent='Your queue is empty.';
  return;
 }

 songs.forEach((song,index)=>{
  const item=document.createElement('div');
  item.className='queue-item'+(index===currentIndex?' active':'');

  const img=document.createElement('img');
  img.src=song.cover;

  const details=document.createElement('div');
  const title=document.createElement('strong');
  title.textContent=song.title;
  const artist=document.createElement('p');
  artist.textContent=song.artist;

  details.append(title,artist);
  item.append(img,details);
  item.onclick=()=>{
   currentIndex=index;
   audio.src=songs[index].preview;
   updatePlayer();
   audio.play().catch(()=>{});
  };
  list.appendChild(item);
 });
}

function openLyrics(){
 showPage('lyricsPage');
}

function showPage(page){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(page).classList.add('active');
}

// Lock screen / media key controls on supported browsers
if('mediaSession' in navigator){
 navigator.mediaSession.setActionHandler('play',()=>audio.play());
 navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
 navigator.mediaSession.setActionHandler('nexttrack',nextSong);
 navigator.mediaSession.setActionHandler('previoustrack',previousSong);
}
</script>

</body>
</html>
